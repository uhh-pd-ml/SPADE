[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humite"
version = "1.0.8"
description = "SPADE: Split-and-Delay Embeddings for Autoregressive High-Granularity Calorimeter Simulation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Joschka Birk, Frank Gaede, Anna Hallin, Gregor Kasieczka, Martina Mozzanica, Henning Rose" },
]
keywords = ["calorimeter", "generative-models", "transformers", "physics", "point-clouds"]
dependencies = [
  "torch>=2.2",
  "lightning>=2.2",
  "hydra-core>=1.3",
  "hydra-colorlog>=1.2",
  "omegaconf>=2.3",
  "numpy>=1.24",
  "scipy>=1.10",
  "h5py>=3.10",
  "awkward>=2.6",
  "vector>=1.1",
  "matplotlib>=3.8",
  "comet-ml>=3.39",
  "nltk>=3.8",
  "rich>=13.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7",
  "black>=24.3",
  "ruff>=0.3",
  "isort>=5.13",
]

[project.scripts]
humite-train = "humite.cli.train:main"
humite-generate = "humite.cli.generate:main"

[project.urls]
Repository = "https://github.com/uhh-pd-ml/SPADE"

[tool.setuptools.packages.find]
include = ["humite*"]

# Ship the Hydra YAML configs and word lists with the package. Keyed by "*" so
# every (sub)package contributes its own data files — this works because each
# config directory is a real package (has __init__.py), which is also what lets
# the installed console scripts resolve `humite.config` as a Hydra config module.
[tool.setuptools.package-data]
"*" = ["*.yaml", "*.txt", "*.xml"]

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 99
preview = "True"

[tool.ruff]
include = ["*.ipynb"]
line-length = 99

[tool.ruff.lint]
ignore = ["F401", "F403", "F405", "F821", "E402"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-third-party = ["torch", "numpy", "matplotlib", "awkward", "pandas"]
