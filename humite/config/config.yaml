defaults:
  - _self_
  - model: model
  - dataset: ecal
  - logger: comet
  - trainer/generative_eval: default

logging:
  level: INFO  # INFO by default; set to DEBUG for verbose runs

seed: 44

trainer:
  batch_size: 4
  max_steps: 500000
  max_epochs: -1
  num_sanity_val_steps: 0
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  log_every_n_steps: 50
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  num_workers: 8
  prefetch_factor: 1
  strategy: auto  # 'auto' = single-device on 1 GPU (no DDP). For multi-GPU use ddp_find_unused_parameters_true
  enable_progress_bar: false
  enable_model_summary: false
  default_root_dir: ${hydra:run.dir}
  resume_ckpt_path: null  # set to a checkpoint path (e.g. .../checkpoints/last.ckpt) to resume training
  logger: ${logger}
  generative_eval:
    n_val_gen_showers: 64
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: ${hydra:run.dir}/checkpoints
      filename: epoch_{epoch:03d}
      monitor: val/loss
      mode: min
      save_top_k: -1
      save_last: true
      every_n_epochs: 1
    - _target_: humite.core.callbacks.moving_avg_early_stopping.MovingAverageEarlyStopping
      monitor: val/loss
      ema_alpha: 0.2
      min_epochs_before_stop: 10
      patience: 3
      min_delta: 0.002
      strict: false
      verbose: true
      check_finite: true

# Optionally warm-start from a pretrained checkpoint (transfer learning).
init_weights:
  ckpt_path: null  # path to a .ckpt to load weights from; null trains from scratch
  subset: all  # all | core
  strict: false
  exclude_patterns: []  # Hydra list, e.g. [final_norm] or [final_norm,norm1,norm2]

log_folder_name: ECAL
bigram: null
run_name: ${now:%Y-%m-%d_%H-%M-%S}_${gpu_name:}_${coalesce:${bigram},${nodename_bigram:}}
output_root: ${oc.env:HUMITE_OUTPUT_DIR,./outputs}/runs

hydra:
  run:
    dir: ${output_root}/${log_folder_name}/${run_name}
  sweep:
    dir: ${output_root}/multirun/${now:%Y-%m-%d}
    subdir: ${hydra.job.num}
